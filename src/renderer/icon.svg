<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Icon "Lấy Transcript".
    Ý tưởng: một dấu gạch dòng (dòng phụ đề) đang được "viết ra" — nửa trên
    là dấu phụ đề truyền hình, nửa dưới là các gạch chữ nổi lên như sóng âm.
    Màu tím xanh -> xanh lam để đồng bộ với giao diện tối.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- dấu phụ đề: khung tối với hai dòng chữ -->
  <rect x="104" y="120" width="304" height="128" rx="20" fill="#0d1017" opacity="0.92"/>
  <rect x="140" y="160" width="164" height="17" rx="8.5" fill="#ffffff" opacity="0.95"/>
  <rect x="140" y="196" width="232" height="17" rx="8.5" fill="#ffffff" opacity="0.7"/>

  <!-- gạch sóng âm: biểu tượng việc đang chuyển tiếng thành chữ -->
  <g fill="url(#wave)">
    <rect x="118" y="322" width="40" height="14" rx="7"/>
    <rect x="172" y="312" width="40" height="24" rx="7"/>
    <rect x="226" y="296" width="40" height="40" rx="7"/>
    <rect x="280" y="310" width="40" height="26" rx="7"/>
    <rect x="334" y="322" width="40" height="14" rx="7"/>
  </g>

  <!-- đường nét "đang ghi" chạy ngang -->
  <rect x="104" y="386" width="304" height="8" rx="4" fill="#ffffff" opacity="0.28"/>
</svg>
